name: Graph-It Review Gate
description: Analyze a pull request diff locally and optionally publish a sticky risk report.
outputs:
  cli-version:
    description: Version of @magic5644/graph-it-live actually installed for this run.
    value: ${{ steps.cli-version.outputs.cli-version }}
  risk:
    description: Computed review risk level.
    value: ${{ steps.review.outputs.risk }}
  score:
    description: Computed review risk score.
    value: ${{ steps.review.outputs.score }}
  architecture-new-errors:
    description: New error violations of graphit.architecture.json that its baseline does not accept (0 without the file); any fails the gate.
    value: ${{ steps.review.outputs.architecture-new-errors }}
inputs:
  token:
    description: GitHub token. Required only when comment is true.
    required: false
  base-ref:
    description: Base Git ref. Defaults to the PR base SHA when available.
    required: false
  comment:
    description: Publish or update the sticky pull-request comment.
    default: "true"
  fail-on-risk:
    description: "Optional gate threshold: high or critical. Empty keeps the gate informative, except on a new error violation of graphit.architecture.json, which always fails it."
    default: ""
  cli-version:
    description: Optional npm version, tag, or range for @magic5644/graph-it-live. Empty installs latest. Ignored when local-dist is set.
    required: false
  local-dist:
    description: Path (relative to GITHUB_WORKSPACE) to a locally-built graph-it.js CLI entry point (e.g. dist/graph-it.js). When set, skips the npm install/version-check steps and runs this build directly — use this to review a PR against the exact code under test instead of the last published npm release.
    required: false
  max-depth:
    description: Maximum transitive symbol-impact depth (1-10).
    default: "3"
  max-files:
    description: Maximum changed files to analyze (at least 1; a CLI older than 1.24.2 accepts at most 1000).
    default: "200"
  delta-diagram:
    description: 'Draw the before/after architecture diagram when the architecture changed (a unit or unit edge added, removed or renamed, a role, a cycle or the rules verdict; file counts alone do not count), upload it as the artifact graph-it-architecture-delta and link it in the comment. Needs CLI 1.26.2 or newer (an older pinned CLI skips it with a notice). Set "false" to turn it off.'
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Graph-It-Live CLI
      id: install-cli
      if: inputs.local-dist == ''
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        CLI_DIR="$RUNNER_TEMP/graph-it-review-gate-cli"
        PACKAGE_SPEC="@magic5644/graph-it-live@latest"
        if [ -n "$CLI_VERSION" ]; then
          PACKAGE_SPEC="@magic5644/graph-it-live@$CLI_VERSION"
        fi
        npm install --no-audit --no-fund --ignore-scripts --prefix "$CLI_DIR" "$PACKAGE_SPEC"
        printf 'cli-dir=%s\n' "$CLI_DIR" >> "$GITHUB_OUTPUT"
    - name: Validate installed Graph-It-Live CLI version
      id: cli-version
      if: inputs.local-dist == ''
      shell: bash
      env:
        CLI_DIR: ${{ steps.install-cli.outputs.cli-dir }}
      run: |
        set -euo pipefail
        npx --no-install --prefix "$CLI_DIR" graph-it --version | node "$GITHUB_ACTION_PATH/verifyCliVersion.mjs"
    - name: Analyze diff
      id: review
      shell: bash
      env:
        CLI_DIR: ${{ steps.install-cli.outputs.cli-dir }}
        LOCAL_DIST: ${{ inputs.local-dist }}
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || 'HEAD~1' }}
        MAX_DEPTH: ${{ inputs.max-depth }}
        MAX_FILES: ${{ inputs.max-files }}
        DELTA_DIAGRAM: ${{ inputs.delta-diagram }}
        DELTA_SUPPORTED: ${{ steps.cli-version.outputs.delta-svg }}
        INSTALLED_VERSION: ${{ steps.cli-version.outputs.cli-version }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        DELTA_FILE=".graph-it/review/architecture-delta.svg"
        DELTA_ARGS=()
        # A stale file of an earlier run must never be uploaded.
        rm -f "$GITHUB_WORKSPACE/$DELTA_FILE"
        if [ "$DELTA_DIAGRAM" = "true" ]; then
          if [ -n "$LOCAL_DIST" ] || [ "$DELTA_SUPPORTED" = "true" ]; then
            DELTA_ARGS=(--deltaSvg "$DELTA_FILE")
          else
            echo "::notice::delta-diagram needs Graph-It-Live CLI 1.26.2 or newer (installed: ${INSTALLED_VERSION:-unknown}): no architecture diagram."
          fi
        fi
        if [ -n "$LOCAL_DIST" ]; then
          CLI_CMD=(node "$GITHUB_WORKSPACE/$LOCAL_DIST")
        else
          CLI_CMD=(npx --no-install --prefix "$CLI_DIR" graph-it)
        fi
        "${CLI_CMD[@]}" review-pr --workspace "$GITHUB_WORKSPACE" --base "$BASE_REF" --depth "$MAX_DEPTH" --max-files "$MAX_FILES" ${DELTA_ARGS[@]+"${DELTA_ARGS[@]}"} --format json > "$RUNNER_TEMP/graph-it-review.json"
        node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/graph-it-review.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "risk="+result.risk+"\nscore="+result.score+"\narchitecture-new-errors="+(result.architecture?.newErrors ?? 0)+"\n")'
        if [ -f "$GITHUB_WORKSPACE/$DELTA_FILE" ]; then
          printf 'delta-file=%s\n' "$DELTA_FILE" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload architecture delta
      id: delta
      if: steps.review.outputs.delta-file != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: graph-it-architecture-delta
        path: ${{ steps.review.outputs.delta-file }}
        overwrite: true
        retention-days: 14
        if-no-files-found: error
        include-hidden-files: true
    - name: Update review comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.token != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REVIEW_FILE: ${{ runner.temp }}/graph-it-review.json
        DELTA_ARTIFACT_URL: ${{ steps.delta.outputs.artifact-url }}
      run: node "$GITHUB_ACTION_PATH/comment.mjs"
    - name: Apply optional risk gate
      shell: node {0}
      env:
        RISK: ${{ steps.review.outputs.risk }}
        THRESHOLD: ${{ inputs.fail-on-risk }}
        ARCHITECTURE_NEW_ERRORS: ${{ steps.review.outputs.architecture-new-errors }}
      run: |
        const path = require("node:path");
        const { runRiskGate } = require(path.join(process.env.GITHUB_ACTION_PATH, "riskGate.cjs"));
        process.exitCode = runRiskGate(process.env.RISK, process.env.THRESHOLD, process.env.ARCHITECTURE_NEW_ERRORS);
