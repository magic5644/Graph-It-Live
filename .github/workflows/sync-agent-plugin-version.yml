name: Sync Agent Plugin Version

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: ['Publish (Selective)']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-agent-plugin-version
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Sync manifests with npm latest
        run: node scripts/sync-agent-plugin-version.mjs

      - name: Commit changes and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- plugins/graph-it-live .claude-plugin/marketplace.json; then
            echo 'Plugin manifests are already current.'
            exit 0
          fi

          branch='automation/sync-agent-plugin-version'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add plugins/graph-it-live .claude-plugin/marketplace.json
          git commit -m 'chore(plugin): sync version with published CLI'

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:$branch"

          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -n "$pr_url" ]; then
            echo "Updated existing pull request: $pr_url"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'chore(plugin): sync version with published CLI' \
              --body 'Automated synchronization of agent plugin manifests with the latest published npm version.'
          fi
