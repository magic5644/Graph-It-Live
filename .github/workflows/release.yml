name: Release and Publish Extension

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.2.3 or v1.2.3)
        required: true
        type: string
      prerelease:
        description: Mark GitHub release as prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      node-version: '24.x'
      run-e2e: true
      package-extension: true

  publish:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          # No dependency cache in release jobs: a poisoned cache entry would ship.
          package-manager-cache: false

      - name: Resolve release tag and version
        id: release_meta
        env:
          RAW_INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            if [[ "$RAW_INPUT" == v* ]]; then
              RELEASE_TAG="$RAW_INPUT"
            else
              RELEASE_TAG="v$RAW_INPUT"
            fi
          fi

          VERSION="${RELEASE_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid version '$VERSION'. Expected semver like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Package Version
        run: npm version ${{ steps.release_meta.outputs.version }} --no-git-tag-version

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Add locked npm binaries to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Package Extension
        run: npm run package:vsix

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "graph-it-live-${{ steps.release_meta.outputs.version }}.vsix"

      - name: Verify VSIX Content
        run: |
          echo "Checking VSIX content structure:"
          vsce ls --tree graph-it-live-*.vsix

      - name: Upload VSIX as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-it-live
          path: "*.vsix"
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --packagePath graph-it-live-${{ steps.release_meta.outputs.version }}.vsix

      - name: Publish to Open VSX Marketplace
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: ovsx publish --packagePath graph-it-live-${{ steps.release_meta.outputs.version }}.vsix

      - name: Publish artifact to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "graph-it-live-*.vsix"
          tag_name: "${{ steps.release_meta.outputs.release_tag }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ steps.release_meta.outputs.release_tag }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
